name: Task
description: A unit of planned work
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true after this is done that is not true now?
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Test scenarios
      description: >-
        The TDD list this work will start from — normal, failure, and boundary cases.
        Written before any production code.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
