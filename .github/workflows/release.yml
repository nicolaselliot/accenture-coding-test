name: Release

# The provisional distribution channel, one per platform: the mobile builds go to Firebase App
# Distribution — the signed Android APK and the ad-hoc iOS .ipa — and the Desktop packages to the
# GitHub Release, built where they can only be built: the .dmg on macOS, the .msi on Windows.
# The APK is attached to the Release as well, so a reviewer who is not an invited tester can
# sideload it: a second copy of one artifact, not a second channel. The .ipa is not, because an
# ad-hoc build installs only on a device whose UDID is in its profile.
#
# Deliberately separate from ci.yml. That workflow runs on every pull request and must stay
# secret-free; this one is the only place in the repository that touches signing material, and it
# runs when a human says so. See docs/adr/0013.
#
# Two triggers, two outcomes:
#   workflow_dispatch — build, sign, distribute to testers, and keep the desktop packages as
#                       workflow artifacts. The way to exercise the pipeline without minting a tag.
#   a v* tag          — the same, plus every artifact attached to a GitHub Release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# No cancel-in-progress, unlike CI. Superseding a pull-request build is free; interrupting one that
# is halfway through uploading a release leaves a release with some of its assets.
concurrency:
  group: release-${{ github.ref }}

# Least privilege by default; the two jobs that write a release elevate their own.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # API 37 ships only as minor versions; there is no plain android-37.
  ANDROID_PLATFORM: platforms;android-37.0
  # Pinned like every other version in this repository. `npm i -g firebase-tools` unpinned would
  # make the distribution step depend on whatever was published this morning.
  FIREBASE_TOOLS_VERSION: 15.29.0

jobs:
  # Created once, before anything uploads, so two jobs cannot race to create the same release —
  # and created as a *draft*, so a build that fails halfway does not leave a published release with
  # no assets in it. The publish job at the bottom is what makes it visible.
  # Tag builds only: a dispatch has no tag to hang a release on.
  create-release:
    name: Create the draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be added to it."
          else
            # The notes come from the commit history this project grades — one green TDD cycle per
            # commit reads well as a changelog.
            gh release create "$TAG" --title "$TAG" --generate-notes --draft
          fi

  android:
    name: Android — sign and distribute
    needs: [create-release]
    # `always()` so a dispatch, where create-release is skipped, still runs. Without it this job
    # inherits the skip and the dispatch trigger silently does nothing.
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is built, so a missing secret costs seconds rather than a full release
      # build — and names itself, instead of surfacing as a base64 error or an unsigned APK.
      - name: Check the release credentials are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("secrets.ANDROID_KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("secrets.ANDROID_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("secrets.ANDROID_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("secrets.ANDROID_KEY_PASSWORD")
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || missing+=("secrets.FIREBASE_SERVICE_ACCOUNT")
          [ -n "$FIREBASE_APP_ID" ] || missing+=("vars.FIREBASE_ANDROID_APP_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release credentials not configured: ${missing[*]}. See docs/adr/0013."
            exit 1
          fi

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: tools platform-tools ${{ env.ANDROID_PLATFORM }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # No Actions cache in the release path, in either direction. Restoring one would let an
          # entry written by any other run on this repository contribute to the APK this job signs
          # with the upload key — a shorter path into a released artifact than anything else here
          # defends against. Not writing one is what keeps the signing passwords on the runner:
          # AGP writes them in plaintext under `build/intermediates/`, and the Gradle
          # configuration cache holds them too. A release build is rare; slow is the right trade.
          cache-disabled: true

      # Into the runner's temporary directory, never the checkout: a key written inside the
      # workspace is one `upload-artifact` glob away from being published, and it would also be
      # visible to any later step that walks the tree.
      - name: Write the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          key="$RUNNER_TEMP/upload-key"
          # umask before the redirect, not chmod after it: the file must never exist readable, not
          # even for the instant between the two commands.
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key")
          # Nothing about the key itself, only that a plausible one arrived. An empty or truncated
          # secret would otherwise fail much later, inside the packaging task.
          test -s "$key" || { echo "::error::Decoded upload key is empty."; exit 1; }

      # prod/release is what ships, and the flavor has to be named: one Gradle invocation generates
      # one AppConfig, so :androidApp builds only the selected flavor's variants (docs/adr/0011).
      # versionCode comes from the run number — a tester installs over the build they already have
      # and Android refuses an APK whose versionCode is below the installed one, so it has to rise
      # and never repeat. A hand-maintained counter collides the first time two branches ship.
      # The version the artifacts claim. A tag gives it: `v1.2.0` becomes `1.2.0`, because
      # jpackage takes three numbers and nothing else, and an APK's versionName should read the
      # same. A dispatch has no tag, so the pinned default in the convention plugin stands.
      - name: Derive the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "No tag; the build keeps the version pinned in the build files."
          fi

      # `check` alongside the assemble, not instead of ci.yml: a tag can be placed on a commit that
      # never reached main, and a dispatch can run from any branch, so without this the artifact
      # handed to real testers is the one thing in the project no suite has run against.
      - name: Verify and assemble the signed prod release
        env:
          GITHUBSEARCH_KEYSTORE_FILE: ${{ runner.temp }}/upload-key
          GITHUBSEARCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GITHUBSEARCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GITHUBSEARCH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew check
          :androidApp:assembleProdRelease
          :androidApp:verifyProdReleaseComposeResources
          -Pgithubsearch.flavor=prod
          -PversionCode=${{ github.run_number }}
          ${RELEASE_VERSION:+-PversionName=$RELEASE_VERSION}
          --stacktrace

      # The window in which the key exists closes here, before the Firebase CLI and its transitive
      # tree run in this same job as the same user. `always()` so a failed build does not leave it
      # behind for the remaining steps either.
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key"

      # A green build does not mean a signed APK: the signing config is absent-safe by design, so
      # a mistyped secret name produces an unsigned artifact and a passing job. This is the gate
      # that makes that impossible — and it names the APK it verified, so the path is checked too.
      - name: Verify the APK is signed
        run: |
          # `2>/dev/null || true` so that a *missing* directory reaches the named error below.
          # `shell: bash` runs with `-e`: find exits non-zero, the assignment inherits that status,
          # and the step would die on `find: …: No such file or directory` — which is precisely the
          # output-layout change this guard exists to report.
          apk=$(find androidApp/build/outputs/apk/prod/release -name '*.apk' -print -quit 2>/dev/null || true)
          test -n "$apk" || { echo "::error::No prod release APK was produced."; exit 1; }
          echo "Verifying $apk"

          case "$apk" in
            *unsigned*)
              echo "::error::$apk is unsigned — the upload key was not applied. Check the four ANDROID_* secrets."
              exit 1
              ;;
          esac

          # Whichever build-tools AGP installed for this build, newest first. Pinning a version
          # here would be a second place for the SDK layout to drift.
          # `|| true` for the same reason as above, and it has to sit outside the pipeline:
          # `pipefail` would otherwise carry find's status through `sort` and `tail`.
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1 || true)
          test -n "$apksigner" || { echo "::error::apksigner not found under $ANDROID_HOME/build-tools."; exit 1; }

          "$apksigner" verify --verbose "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      # The Firebase CLI rather than the Gradle plugin, so the deploy credential never joins the
      # build classpath and `./gradlew build` stays the same command everywhere else. See ADR-0013.
      # Installed before any credential is written, and with lifecycle scripts off. The pin covers
      # firebase-tools itself; `npm install` still resolves its transitive tree at install time and
      # would run every dependency's install script — in a step that would otherwise already have
      # the upload key and the service account sitting on disk. Verified that the CLI works with
      # scripts ignored.
      - name: Install the Firebase CLI
        run: npm install --global --ignore-scripts "firebase-tools@$FIREBASE_TOOLS_VERSION"

      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'reviewers' }}
          # Through env, never interpolated into the script below. `${{ }}` is substituted before
          # the shell parses the line, so quotes do not contain it and a ref name carrying `$(…)`
          # would execute — in the one job that holds every secret in the repository. Tags are not
          # covered by main's branch protection, so this is the review gate that ref does not have.
          TAG: ${{ github.ref_name }}
        run: |
          # Outside the workspace, like the key, and removed on the way out.
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          # The trap first, so an interrupt between here and the write still removes the file. Then
          # umask before the redirect, exactly as the upload key does it: a service-account key must
          # not exist readable either, not even for the instant a trailing `chmod` leaves open.
          trap 'rm -f "$credentials"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials")
          # Same reasoning as the key: an empty or truncated secret should name itself here rather
          # than surface as an authentication error from the CLI.
          test -s "$credentials" || { echo "::error::Firebase service account secret is empty."; exit 1; }

          GOOGLE_APPLICATION_CREDENTIALS="$credentials" firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$TAG (build $GITHUB_RUN_NUMBER, $GITHUB_SHA)"

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$APK_PATH" --clobber

  ios:
    name: iOS — archive and distribute
    needs: [create-release]
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: macos-latest
    # No `contents: write`, unlike the other two artifact jobs, and that is the channel matrix
    # rather than an omission: an ad-hoc .ipa installs only on a device whose UDID is in its
    # provisioning profile, so attaching it to a public release would advertise a download almost
    # nobody can use. Firebase is the whole distribution path for iOS. See docs/adr/0013.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is built, as on the Android leg: a missing credential should cost seconds
      # and name itself, rather than surfacing as a signing error twenty minutes into an archive.
      - name: Check the release credentials are present
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
        run: |
          missing=()
          [ -n "$CERTIFICATE" ] || missing+=("secrets.APPLE_CERTIFICATE_BASE64")
          [ -n "$CERTIFICATE_PASSWORD" ] || missing+=("secrets.APPLE_CERTIFICATE_PASSWORD")
          [ -n "$PROFILE" ] || missing+=("secrets.APPLE_PROVISIONING_PROFILE_BASE64")
          [ -n "$TEAM_ID" ] || missing+=("secrets.APPLE_TEAM_ID")
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || missing+=("secrets.FIREBASE_SERVICE_ACCOUNT")
          [ -n "$FIREBASE_APP_ID" ] || missing+=("vars.FIREBASE_IOS_APP_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release credentials not configured: ${missing[*]}. See docs/adr/0013."
            exit 1
          fi

      # Pinned here and printed-only in ci.yml, deliberately. This job produces the artifact real
      # testers install, so the toolchain that built it has to be the one the table records; the
      # pull-request leg only answers "does it still build" and would fail every PR the week
      # GitHub rotates the image. A missing pin fails loudly and lists what the image does carry,
      # so the fix is a one-line ADR rather than a mystery.
      - name: Select the pinned Xcode
        run: |
          pinned=/Applications/Xcode_26.6.app
          if [ ! -d "$pinned" ]; then
            echo "::error::$pinned is not on this runner. Available:"
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  none"
            exit 1
          fi
          sudo xcode-select -s "$pinned"
          xcodebuild -version

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Needed even though nothing Android is built: the Xcode build phase runs Gradle, AGP is
      # applied to every shared module, and the project cannot configure without an SDK.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: tools platform-tools ${{ env.ANDROID_PLATFORM }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Same reasoning as the other two jobs: nothing this job publishes should come out of a
          # cache another run wrote, and nothing it holds should be written into one.
          cache-disabled: true

      # A keychain of its own, deleted on the way out, so the certificate never joins the login
      # keychain and cannot outlive the job. Written under `umask 077` into the runner's temporary
      # directory rather than the checkout, as the Android upload key is.
      - name: Import the signing material
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"

          (umask 077 && printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate")
          (umask 077 && printf '%s' "$PROFILE" | base64 --decode > "$profile")
          test -s "$certificate" || { echo "::error::Decoded certificate is empty."; exit 1; }
          test -s "$profile" || { echo "::error::Decoded provisioning profile is empty."; exit 1; }

          # A random password for a keychain that exists for one job; it is never persisted.
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign prompts for permission to use the key and the job hangs until
          # it times out — the single most common way this step fails silently on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # The archive resolves the identity through the search list, so the new keychain has to
          # be in it. The login keychain stays, because the build reads other things from it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # Both locations on purpose. Xcode moved provisioning profiles to the UserData path, and
          # xcodebuild still reads the legacy one; which of the two a given version prefers is not
          # something this project can verify without a signed run, so it installs to each.
          for directory in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                           "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$directory"
            cp "$profile" "$directory/"
          done

          # The profile's own name, so PROVISIONING_PROFILE_SPECIFIER needs no second secret and
          # cannot drift from the profile it names. The plist is inside a CMS envelope.
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          name=$(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist")
          test -n "$name" || { echo "::error::Could not read the profile's name."; exit 1; }
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          # The name is not a secret; the profile it came from is already public in every build.
          echo "Using provisioning profile: $name"

      # `v1.2.0` becomes MARKETING_VERSION 1.2.0 and the run number becomes the build number, so an
      # iOS release is labelled the same as the Android one from the same tag. Without this, iOS
      # ships 1.0.0 (1) beside Android's 1.2.0 (47) in one Firebase tester group and nobody can
      # tell which pair belongs together.
      - name: Derive the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "No tag; the archive keeps the version pinned in the project."
          fi

      # Linked here, as its own step, rather than left to the archive's script phase — because this
      # is the one task in the project that needs a large heap and it should be the only thing that
      # gets one. Release-mode Kotlin/Native runs a whole-program pass that exhausts the default
      # heap; setting that globally in gradle.properties applied it to *every* native compilation
      # and, on a runner with about 7 GB, turned each link into paging: one debug test link went
      # from 7.5 minutes to 33 and the macOS CI leg from 14 minutes to over 70. So it is passed per
      # invocation, to one task.
      #
      # The archive below then finds this up to date and its embed step links nothing. The device
      # architecture only, which is what `generic/platform=iOS` archives.
      - name: Link the release framework
        run: >
          ./gradlew :shared:linkReleaseFrameworkIosArm64
          -Pkotlin.native.jvmArgs=-Xmx6g
          --stacktrace

      # Release, which is the prod flavor: Config-prod.xcconfig sets GITHUBSEARCH_FLAVOR=prod, and
      # the generator then drops the token and forces logging to NONE whatever the environment
      # carries. That is what makes a distributed iOS build unable to hold a credential.
      #
      # Manual signing, because automatic would need an App Store Connect session this channel
      # deliberately does not have — nothing here talks to App Store Connect.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ${RELEASE_VERSION:+MARKETING_VERSION=$RELEASE_VERSION} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Generated here rather than committed, so the team identifier stays out of version control —
      # the same reason it is no longer in project.pbxproj. `release-testing` is the current name
      # for what used to be called `ad-hoc`; `ad-hoc` still works and warns.
      - name: Export the ad-hoc IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.nicolas.githubsearch</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      # A green archive does not mean a signed one, the same trap the Android leg guards: the
      # filename says nothing, so the signature is read back off the artifact itself.
      - name: Verify the IPA is signed
        run: |
          # 2>/dev/null || true so a missing export directory reaches the named error below rather
          # than ending the step under `bash -e`.
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit 2>/dev/null || true)
          test -n "$ipa" || { echo "::error::No .ipa was exported."; exit 1; }
          echo "Exported $ipa"

          unzip -q -o "$ipa" -d "$RUNNER_TEMP/ipa-check"
          app=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)
          test -n "$app" || { echo "::error::The .ipa has no app in Payload/."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app"
          # Names the signing identity in the log, so a wrong certificate is visible rather than
          # inferred. Validity, not identity — the same limit ADR-0013 records for the APK.
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E "^Authority=|^TeamIdentifier=" || true

          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      # Closes the window in which the certificate exists, before the Firebase CLI and its
      # transitive tree run as the same user in this same job. `always()`, so a failed archive does
      # not leave the key behind for the remaining steps either.
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/profile.mobileprovision"

      - name: Install the Firebase CLI
        run: npm install --global --ignore-scripts "firebase-tools@$FIREBASE_TOOLS_VERSION"

      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'reviewers' }}
          # Through env, never interpolated into the script: `${{ }}` is substituted before the
          # shell parses the line, and tags are not covered by main's branch protection.
          TAG: ${{ github.ref_name }}
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials")
          test -s "$credentials" || { echo "::error::Firebase service account secret is empty."; exit 1; }

          GOOGLE_APPLICATION_CREDENTIALS="$credentials" firebase appdistribution:distribute "$IPA_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$TAG (build $GITHUB_RUN_NUMBER, $GITHUB_SHA)"

          echo "::notice::Distributed. A tester whose device UDID is not in the provisioning" \
               "profile cannot install this build — see docs/adr/0013."

  desktop:
    name: Desktop — ${{ matrix.package }}
    needs: [create-release]
    if: always() && !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One platform failing should not hide whether the other packaged.
      fail-fast: false
      matrix:
        include:
          # jpackage can only build the installer of the host it runs on, which is the whole reason
          # this is a matrix rather than one job.
          - os: macos-latest
            package: dmg
          - os: windows-latest
            package: msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          # Temurin, and it matters here beyond consistency: the Compose plugin refuses to package
          # with a Homebrew JDK (checkJdkVendor), which is why the .dmg cannot be built on this
          # project's development machine at all.
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Needed even here: AGP is applied to every shared module, so the build cannot configure
          # without an SDK — the Desktop packaging task still has to configure the whole project.
          packages: tools platform-tools ${{ env.ANDROID_PLATFORM }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Same reasoning as the Android job: this one holds no secret, but it produces the
          # installers attached to a public release, and their integrity is the point.
          cache-disabled: true

      # jpackage shells out to WiX for the .msi and fails without it. Installed rather than assumed:
      # the runner image has carried it in the past and dropped it before now, and the failure it
      # produces ("Cannot find WiX tools") arrives after a full build.
      - name: Ensure WiX 3 is available
        if: matrix.package == 'msi'
        run: |
          # `candle`, deliberately, and not the `wix` dotnet tool: that one is WiX 4+, which only
          # JDK 22's jpackage can drive. This job runs on JDK 21, which shells out to WiX 3's
          # candle and light — so a runner carrying `wix` but not `candle` must still install.
          if command -v candle > /dev/null 2>&1; then
            echo "WiX 3 already present on the runner."
          else
            # Pinned like every other version here. The chocolatey community feed is third-party
            # code running in the job that produces the installer attached to a public release.
            choco install wixtoolset --version=3.14.1 --no-progress --yes
            echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
          fi

      # A separate step because GITHUB_PATH only affects *later* steps. Without this, a chocolatey
      # package that installs somewhere else succeeds, the wrong directory joins PATH, and the
      # failure arrives as a jpackage error after a full build — the late failure the install step
      # above exists to prevent.
      - name: Verify WiX is on the path
        if: matrix.package == 'msi'
        run: |
          command -v candle > /dev/null 2>&1 || {
            echo "::error::WiX 3 installed but candle is not on PATH. Check the install directory."
            exit 1
          }
          candle -? > /dev/null 2>&1 || true
          echo "candle: $(command -v candle)"

      # The prod flavor names the distribution GitHubSearch rather than GitHubSearchDev, so what a
      # tester installs does not sit beside a development build (docs/adr/0011).
      - name: Derive the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "No tag; the package keeps the version pinned in the build files."
          fi

      - name: Package the distribution
        run: >
          ./gradlew :desktopApp:packageDistributionForCurrentOS
          -Pgithubsearch.flavor=prod
          ${RELEASE_VERSION:+-PpackageVersion=$RELEASE_VERSION}
          --stacktrace

      - name: Locate the package
        run: |
          # Searched from the binaries root rather than the exact subdirectory: the layout under
          # it is the Compose plugin's business, and this machine cannot package at all — the
          # Compose plugin refuses a Homebrew JDK — so the path could not be verified before now.
          # The guard below is what turns a layout change into a named failure rather than a
          # release with a missing asset.
          # `2>/dev/null || true` so a missing binaries root reaches the guard below rather than
          # killing the step under `-e` — the layout change is the case this is here to name.
          package=$(find desktopApp/build/compose/binaries -name "*.${{ matrix.package }}" -type f -print -quit 2>/dev/null || true)
          test -n "$package" || { echo "::error::No .${{ matrix.package }} was produced."; exit 1; }
          echo "Packaged $package"
          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"

      # Kept even on a dispatch, which has no release to attach to: the point of a dispatch is to
      # get the artifact without minting a tag.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.package }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$PACKAGE_PATH" --clobber

  # The draft becomes a release only once every asset is on it. A build that fails halfway leaves a
  # draft, which is invisible to anyone not looking for it and can be published by hand after the
  # fix — where publishing first and uploading second leaves a notified release with missing
  # downloads, and the `.msi` is the leg most likely to fail on a runner image change.
  #
  # Both artifact jobs must succeed, deliberately: a release advertising three downloads and
  # carrying two is worse than one that arrived a day later.
  publish-release:
    name: Publish the release
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: `gh` takes the repository from GH_REPO, and this job only edits metadata.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
