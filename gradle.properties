# --- Gradle runtime ------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Configuration cache and build cache are on from PR1 rather than retrofitted: a build that was
# never configuration-cache clean is expensive to make clean later.
org.gradle.configuration-cache=true
org.gradle.caching=true

# --- Kotlin --------------------------------------------------------------------------------------
kotlin.code.style=official
# Lets non-macOS machines (Linux CI) configure the build without the Apple targets failing it.
kotlin.native.ignoreDisabledTargets=true

# Heap for the Kotlin/Native compiler process, which is not the Gradle daemon's and not covered by
# org.gradle.jvmargs above. Needed from PR17, when :shared gained a framework binary and with it a
# linkRelease* task: release mode runs a whole-program call-graph analysis
# (backend.konan.optimizations.CallGraphBuilder) that debug mode skips entirely, and on this project
# it exhausts 4g and fails the build with `Compilation failed: Java heap space`.
#
# Set here rather than by raising org.gradle.jvmargs, which would hand the extra gigabytes to every
# Gradle invocation on every platform — Android assembles, lint, ktlint — for the benefit of the one
# task that needs them. Only macOS ever runs it; the other runners skip the Apple targets.
kotlin.native.jvmArgs=-Xmx6g

# --- Android -------------------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Compose -------------------------------------------------------------------------------------
# Compose compiler metrics: opt-in per invocation with -PcomposeCompilerReports=true, so stability
# regressions are measurable rather than theoretical. Off by default — it slows every build.
composeCompilerReports=false

# --- Build variants ------------------------------------------------------------------------------
# The flavor is selected per invocation with -Pgithubsearch.flavor=dev|prod (or GITHUBSEARCH_FLAVOR,
# or `flavor=` in the developer properties file), and defaults to dev. It decides what the generated
# AppConfig carries — only dev may embed a token or honour a log-level override — and which of
# :androidApp's variants are built, so an artifact cannot disagree with the config compiled into it:
#
#     ./gradlew :androidApp:assembleProdRelease -Pgithubsearch.flavor=prod
#
# Deliberately not given a value here. The default lives in AppFlavor.Default, and stating it in two
# places is how the two come to disagree. See docs/adr/0011.
